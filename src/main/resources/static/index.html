<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Semijoias</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
        h1 { color: #b8860b; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4e4bc; }
        input, select { padding: 6px; margin: 4px; }
        button { padding: 6px 12px; cursor: pointer; }
        .form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    </style>
</head>
<body>
<h1>Cadastro de Semijoias</h1>

<div class="form">
    <input id="nome" placeholder="Nome">
    <input id="tipo" placeholder="Tipo (anel, colar...)">
    <input id="material" placeholder="Material">
    <input id="preco" type="number" step="0.01" placeholder="Preco">
    <input id="peso" type="number" step="0.1" placeholder="Peso (g)">
    <input id="descricao" placeholder="Descricao">
    <label><input id="disponivel" type="checkbox" checked> Disponivel</label>
    <button onclick="salvar()">Salvar</button>
</div>

<table>
    <thead>
    <tr><th>ID</th><th>Nome</th><th>Tipo</th><th>Material</th><th>Preco</th><th>Peso</th><th>Desc</th><th>Disp</th><th>Acoes</th></tr>
    </thead>
    <tbody id="tabela"></tbody>
</table>

<script>
const API = '/api/semijoias';
let editandoId = null;

async function listar() {
    const res = await fetch(API);
    const data = await res.json();
    const tb = document.getElementById('tabela');
    tb.innerHTML = '';
    data.forEach(s => {
        tb.innerHTML += `<tr>
            <td>${s.id}</td><td>${s.nome}</td><td>${s.tipo}</td><td>${s.material}</td>
            <td>R$ ${s.preco}</td><td>${s.pesoGramas}g</td><td>${s.descricao || ''}</td>
            <td>${s.disponivel ? 'Sim' : 'Nao'}</td>
            <td>
                <button onclick='editar(${JSON.stringify(s)})'>Editar</button>
                <button onclick='deletar(${s.id})'>Excluir</button>
            </td>
        </tr>`;
    });
}

function editar(s) {
    editandoId = s.id;
    document.getElementById('nome').value = s.nome;
    document.getElementById('tipo').value = s.tipo;
    document.getElementById('material').value = s.material;
    document.getElementById('preco').value = s.preco;
    document.getElementById('peso').value = s.pesoGramas;
    document.getElementById('descricao').value = s.descricao || '';
    document.getElementById('disponivel').checked = s.disponivel;
}

async function salvar() {
    const body = {
        nome: document.getElementById('nome').value,
        tipo: document.getElementById('tipo').value,
        material: document.getElementById('material').value,
        preco: parseFloat(document.getElementById('preco').value),
        pesoGramas: parseFloat(document.getElementById('peso').value),
        descricao: document.getElementById('descricao').value,
        disponivel: document.getElementById('disponivel').checked
    };
    const opts = { method: editandoId ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) };
    const url = editandoId ? `${API}/${editandoId}` : API;
    await fetch(url, opts);
    editandoId = null;
    limpar();
    listar();
}

function limpar() {
    ['nome','tipo','material','preco','peso','descricao'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('disponivel').checked = true;
}

async function deletar(id) {
    if (confirm('Excluir semijoia ' + id + '?')) {
        await fetch(`${API}/${id}`, { method: 'DELETE' });
        listar();
    }
}

listar();
</script>
</body>
</html>
